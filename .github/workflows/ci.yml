# The numbers ARE the argument.
#
# A workflow that only checks exit codes would let a refactor silently move the
# benchmark, and the benchmark is the whole claim this project makes. So the
# engine job parses output and fails on drift. Every number asserted below was
# confirmed locally before it was written here.
name: ci

on:
  push:
  pull_request:
  # The corpus jobs are a closed loop: reproducible to the byte, and for that
  # reason never fetching anything. `selfheal` closes the other half by running
  # the same claim against a page that is actually served, with nobody watching.
  # 07:00 UTC daily, and on demand.
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  engine:
    name: engine — assertions, benchmark, replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The migration to TypeScript put a second kind of breakage in reach: a
      # type error that `tsx` happily strips and runs anyway. Checked before the
      # numbers, so a red build says which of the two went wrong.
      - name: typecheck — strict, whole repo
        run: npx tsc --noEmit

      - name: selftest — 34 assertions
        run: |
          out=$(npm test 2>&1)
          echo "$out" | tail -3
          ok=$(echo "$out" | grep -c '^  ok ' || true)
          echo "$out" | grep -q 'all checks pass' || { echo "::error::selftest did not report 'all checks pass'"; exit 1; }
          [ "$ok" -eq 34 ] || { echo "::error::expected 34 assertions, saw $ok"; exit 1; }
          echo "34 assertions ✓"

      - name: bench — gated arm publishes 0 wrong values across 153 cases
        run: |
          out=$(npm run bench 2>&1)
          row=$(echo "$out" | grep 'margin gate') || { echo "::error::no 'margin gate' row in bench output"; exit 1; }
          echo "$row"
          n=$(echo "$row" | awk '{print $4}')
          wrong=$(echo "$row" | awk '{print $7}')
          [ "$n" = "153" ]     || { echo "::error::expected 153 cases, saw $n"; exit 1; }
          [ "$wrong" = "0.0%" ] || { echo "::error::gated arm published $wrong wrong values, expected 0.0%"; exit 1; }
          echo "153 cases, 0.0% wrong ✓"

      # 66, not 24. The label read "24 heals" from before the anchor fix and the
      # assertion below caught the drift on every run since -- a red step whose
      # own name disagreed with it. The `ok` count is asserted too now: heals and
      # abstentions alone leave one degree of freedom, so a change that moved
      # runs between `ok` and `heal` in equal numbers would have passed.
      - name: replay — 74 runs, 8 ok, 66 heals, 0 abstentions
        run: |
          out=$(npm run replay 2>&1)
          echo "$out" | grep -E 'replayed|ok|heal|abstain'
          echo "$out" | grep -q 'replayed 74 runs' || { echo "::error::expected 74 runs"; exit 1; }
          ok=$(echo    "$out" | awk '/^  ok /{print $2}')
          heals=$(echo "$out" | awk '/^  heal /{print $2}')
          abst=$(echo  "$out" | awk '/^  abstain /{print $2}')
          [ "$ok"    = "8"  ] || { echo "::error::expected 8 clean runs, saw $ok"; exit 1; }
          [ "$heals" = "66" ] || { echo "::error::expected 66 heals, saw $heals"; exit 1; }
          [ "$abst"  = "0"  ] || { echo "::error::expected 0 abstentions, saw $abst"; exit 1; }
          echo "74 / 8 / 66 / 0 ✓"

      - name: proof records are byte-identical
        run: |
          git diff --exit-code -- results/events.jsonl \
            || { echo "::error::replay changed results/events.jsonl — the proof records moved"; exit 1; }
          echo "events.jsonl byte-identical ✓"

  app:
    name: app — vitest against a real postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: assay
          POSTGRES_DB: assay
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:assay@127.0.0.1:5432/assay
      # A DB-backed test that early-returns without Postgres reports PASSED, not
      # skipped -- the test count is identical either way, so counting cannot
      # catch it. This flag turns that vacuous green into a hard failure.
      ASSAY_REQUIRE_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: apply migrations
        # psql, not `drizzle-kit migrate`: the generated SQL is plain and applying
        # it directly avoids a migrate step observed to hang outside a container.
        run: |
          for f in src/store/migrations/*.sql; do
            echo "-> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - run: npx vitest run

      # dist/fingerprint.js is what gets pasted into Bright Data's Cheerio
      # worker, and a worker has no module loader. The vitest run above rebuilds
      # and checks it; this proves the build step works from a clean checkout.
      - name: fingerprint artifact — imports nothing
        run: |
          npm run build:fingerprint
          if grep -vE '^\s*(//|\*|/\*)' dist/fingerprint.js | grep -qE '\b(import|require)\b'; then
            echo "::error::dist/fingerprint.js contains an import or require"
            exit 1
          fi
          echo "artifact imports nothing ✓"

  # The claim, re-established on a live site, unattended.
  #
  # This is the only job that leaves the runner. It needs no secret: the testbed
  # is a public page and Assay reads it with `fetch`. Nothing here is gated on a
  # token, so a fork sees the same green check the parent does.
  #
  # tools/selfheal.ts explains what it asserts. What matters here is the two
  # kinds of failure and that they are NOT the same colour:
  #
  #   75  the testbed did not answer. Nothing was measured, so nothing is
  #       claimed, and the step passes with a warning. A check that goes red
  #       when somebody else's host has a bad morning is a check people learn to
  #       ignore, and an ignored check is worse than no check.
  #   1   Assay published a wrong value on a page it should have held. That is
  #       the one failure this whole project is about, and it is loud.
  selfheal:
    name: selfheal — a live page changes, and the number holds
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: assay
          POSTGRES_DB: assay
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:assay@127.0.0.1:5432/assay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: apply migrations
        run: |
          for f in src/store/migrations/*.sql; do
            echo "-> $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: selfheal — heal to the right element or abstain, never a wrong value
        run: |
          set +e
          out=$(npx tsx tools/selfheal.ts 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" = "75" ]; then
            echo "::warning::the testbed was unreachable — nothing was measured, so nothing is claimed"
            exit 0
          fi
          [ "$code" = "0" ] || { echo "::error::selfheal exited $code"; exit 1; }

          line=$(echo "$out" | grep '^selfheal: [0-9]') \
            || { echo "::error::selfheal printed no summary line"; exit 1; }
          n=$(echo      "$line" | sed -n 's/.*selfheal: \([0-9]*\) variants.*/\1/p')
          correct=$(echo "$line" | sed -n 's/.*, \([0-9]*\) correct.*/\1/p')
          healed=$(echo  "$line" | sed -n 's/.*, \([0-9]*\) healed.*/\1/p')
          held=$(echo    "$line" | sed -n 's/.*, \([0-9]*\) held.*/\1/p')
          wrong=$(echo   "$line" | sed -n 's/.*, \([0-9]*\) wrong.*/\1/p')

          # The thesis. Everything else on this list exists to stop this line
          # from being satisfied by a run that did nothing.
          [ "$wrong" = "0" ] \
            || { echo "::error::assay published $wrong wrong value(s) on a live page"; exit 1; }

          # `>=`, not `=`: this is the TESTBED's count, not Assay's. A variant
          # added over there must not turn this check red, but one that vanished
          # would mean the run measured less than it claims to.
          [ "$n" -ge 9 ] || { echo "::error::expected at least 9 variants, saw $n"; exit 1; }

          # "0 wrong" is free if nothing was published and free if nothing broke.
          # A heal and a hold in the same run is the gate demonstrably still
          # saying both yes and no.
          [ "$healed" -ge 1 ] \
            || { echo "::error::no variant healed — the heal gate never said yes"; exit 1; }
          [ "$held" -ge 1 ] \
            || { echo "::error::no variant was held — the gate never said no"; exit 1; }
          [ "$correct" -ge "$healed" ] \
            || { echo "::error::$healed healed but only $correct correct"; exit 1; }

          echo "$n variants, $correct correct ($healed by healing), $held held, 0 wrong ✓"

  web:
    name: web — build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build --workspace web
