# Self-host shape: three services, one volume. The hosted instance runs this
# same artifact, so there is one path to maintain and test.
#
#   docker compose up -d
#
# `web` serves and writes decisions; `worker` owns fetch -> detect -> heal ->
# gate -> publish. Next never runs a scrape: a run would hold a request open and
# compete with page loads, and no request timeout makes that a good idea.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: assay
      POSTGRES_PASSWORD: assay
      POSTGRES_DB: assay
      # A subdirectory, not the mount point: volumes backed by a real
      # filesystem carry a lost+found, and initdb refuses a non-empty PGDATA.
      # Docker's named volumes happen not to; Apple Container's do.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assay"]
      interval: 5s
      retries: 10
    # Loopback, like `web` below and for the same reason. Nothing outside this
    # host needs the database -- `web` and `worker` reach it over the compose
    # network by name, and `db:migrate` runs as a compose service. Binding it
    # to the host's loopback keeps `DATABASE_URL=...@localhost:5432` working
    # for tests run from the host, without publishing `assay/assay` to the
    # network the host happens to sit on.
    ports:
      - "127.0.0.1:5432:5432"

  web:
    build: .
    # Schema first: `docker compose run --rm web npm run db:migrate`
    command: npm --workspace web run start
    environment:
      DATABASE_URL: postgres://assay:assay@postgres:5432/assay
      ASSAY_CAPTURES: /data/captures
      AUTH_MODE: ${AUTH_MODE:-none}
    volumes:
      - captures:/data/captures
    depends_on:
      postgres:
        condition: service_healthy
    # LOOPBACK, DELIBERATELY. `AUTH_MODE` defaults to `none`, which is the
    # documented self-host default and means this app authenticates nobody:
    # every operator screen -- resolving held decisions, clearing a brake,
    # editing a contract -- is reachable by anyone who can open the port.
    # `"3000:3000"` binds 0.0.0.0, so the quickstart used to hand that to the
    # whole network the host is on. It binds to this host only; putting it in
    # front of other people is a deliberate act, not the default one. See
    # "Exposing it on purpose" in README.md and /docs/self-host.
    ports:
      - "127.0.0.1:3000:3000"

  # The worker owns fetch -> detect -> heal -> gate -> publish. It is a separate
  # service, not a route in `web`: a run would otherwise hold a request open and
  # compete with page loads. Same image, different entrypoint.
  worker:
    build: .
    command: npx tsx tools/worker.ts
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://assay:assay@postgres:5432/assay
      ASSAY_CAPTURES: /data/captures
      # Delivery is optional: with no key the worker records the break as
      # undelivered and carries on. An unset key must never stop a run.
      ASSAY_RESEND_KEY: ${ASSAY_RESEND_KEY:-}
      ASSAY_MAIL_FROM: ${ASSAY_MAIL_FROM:-}
      ASSAY_MAIL_TO: ${ASSAY_MAIL_TO:-}
      ASSAY_WEBHOOK_URL: ${ASSAY_WEBHOOK_URL:-}
      ASSAY_WEBHOOK_SECRET: ${ASSAY_WEBHOOK_SECRET:-}
    volumes:
      - captures:/data/captures
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  captures:
